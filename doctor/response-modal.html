<script>
// Response Modal JavaScript
let currentAppointmentId = null;

function openResponseModal(appointmentId, patientName, appointmentDate, appointmentTime) {
    currentAppointmentId = appointmentId;
    
    // Set patient info
    document.getElementById('modalPatientName').textContent = patientName;
    document.getElementById('modalAppointmentDate').textContent = formatDate(appointmentDate);
    document.getElementById('modalAppointmentTime').textContent = formatTime(appointmentTime);
    
    // Set appointment ID
    document.getElementById('responseAppointmentId').value = appointmentId;
    
    // Reset form
    document.getElementById('responseForm').reset();
    document.getElementById('responseMessage').style.display = 'none';
    document.getElementById('responseMessage').className = '';
    
    // Hide all response fields
    document.getElementById('confirmFields').style.display = 'none';
    document.getElementById('rescheduleFields').style.display = 'none';
    document.getElementById('cancelFields').style.display = 'none';
    
    // Show modal
    document.getElementById('responseModal').classList.add('active');
}

function closeResponseModal() {
    document.getElementById('responseModal').classList.remove('active');
    document.getElementById('responseForm').reset();
    document.getElementById('responseMessage').style.display = 'none';
    currentAppointmentId = null;
}

function toggleResponseFields() {
    const selected = document.querySelector('input[name="response_type_radio"]:checked');
    if (!selected) return;
    
    const responseType = selected.value;
    document.getElementById('responseType').value = responseType;
    
    // Hide all fields
    document.getElementById('confirmFields').style.display = 'none';
    document.getElementById('rescheduleFields').style.display = 'none';
    document.getElementById('cancelFields').style.display = 'none';
    
    // Show relevant fields
    if (responseType === 'confirm') {
        document.getElementById('confirmFields').style.display = 'block';
    } else if (responseType === 'reschedule') {
        document.getElementById('rescheduleFields').style.display = 'block';
        // Set minimum date to today
        document.getElementById('newDate').min = new Date().toISOString().split('T')[0];
    } else if (responseType === 'cancel') {
        document.getElementById('cancelFields').style.display = 'block';
    }
}

function updateMeetingPlaceholder() {
    const type = document.getElementById('meetingType').value;
    const input = document.getElementById('meetingLink');
    const help = document.getElementById('meetingHelp');
    
    if (type === 'google_meet') {
        input.placeholder = 'Enter Google Meet link (e.g., meet.google.com/abc-defg-hij)';
        help.textContent = 'Format: meet.google.com/xxx-xxxx-xxx or full URL';
    } else if (type === 'whatsapp') {
        input.placeholder = 'Enter WhatsApp number (e.g., +256 700 000 000)';
        help.textContent = 'Format: +256XXXXXXXXX (Uganda format)';
    } else if (type === 'phone') {
        input.placeholder = 'Enter phone number to call from (e.g., +256 700 000 000)';
        help.textContent = 'Format: +256XXXXXXXXX (Uganda format)';
    } else {
        input.placeholder = 'Select meeting type first';
        help.textContent = '';
    }
}

function updateRescheduleMeetingPlaceholder() {
    const type = document.getElementById('rescheduleMeetingType').value;
    const input = document.getElementById('rescheduleMeetingLink');
    const help = document.getElementById('rescheduleMeetingHelp');
    
    if (type === 'google_meet') {
        input.placeholder = 'Enter Google Meet link (e.g., meet.google.com/abc-defg-hij)';
        help.textContent = 'Format: meet.google.com/xxx-xxxx-xxx or full URL';
    } else if (type === 'whatsapp') {
        input.placeholder = 'Enter WhatsApp number (e.g., +256 700 000 000)';
        help.textContent = 'Format: +256XXXXXXXXX (Uganda format)';
    } else if (type === 'phone') {
        input.placeholder = 'Enter phone number to call from (e.g., +256 700 000 000)';
        help.textContent = 'Format: +256XXXXXXXXX (Uganda format)';
    } else {
        input.placeholder = 'Select meeting type first';
        help.textContent = '';
    }
}

function formatDate(dateStr) {
    const date = new Date(dateStr);
    return date.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
}

function formatTime(timeStr) {
    // Convert 24h to 12h format
    const [hours, minutes] = timeStr.split(':');
    const hour = parseInt(hours);
    const ampm = hour >= 12 ? 'PM' : 'AM';
    const hour12 = hour % 12 || 12;
    return `${hour12}:${minutes} ${ampm}`;
}

// Store form data for confirmation
let pendingFormData = null;
let pendingResponseType = null;

// Form submission
document.getElementById('responseForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const formData = new FormData(this);
    const messageDiv = document.getElementById('responseMessage');
    const submitBtn = document.getElementById('submitResponseBtn');
    const submitText = document.getElementById('submitBtnText');
    const submitLoader = document.getElementById('submitBtnLoader');
    
    // Validate form
    const responseType = formData.get('response_type');
    if (!responseType) {
        showMessage('Please select a response type.', 'error');
        return;
    }
    
    // Store form data for later confirmation
    pendingFormData = formData;
    pendingResponseType = responseType;
    
    // Show confirmation modal
    openConfirmationModal(responseType);
});

function openConfirmationModal(responseType) {
    const confirmModal = document.getElementById('confirmationModal');
    const confirmTitle = document.getElementById('confirmTitle');
    const confirmMessage = document.getElementById('confirmMessage');
    
    let title = '';
    let message = '';
    
    if (responseType === 'confirm') {
        title = 'Confirm Appointment Response?';
        message = 'You are confirming this appointment. The patient will be notified with the meeting details.';
    } else if (responseType === 'reschedule') {
        title = 'Reschedule Appointment?';
        message = 'The patient will be notified that their appointment needs to be rescheduled.';
    } else if (responseType === 'cancel') {
        title = 'Cancel Appointment?';
        message = 'The patient will be notified that their appointment has been cancelled. This action cannot be undone.';
    }
    
    confirmTitle.textContent = title;
    confirmMessage.textContent = message;
    confirmModal.classList.add('active');
}

function closeConfirmationModal() {
    document.getElementById('confirmationModal').classList.remove('active');
}

function confirmResponse() {
    if (!pendingFormData || !pendingResponseType) {
        alert('Error: No response data found.');
        return;
    }
    
    const confirmModal = document.getElementById('confirmationModal');
    const submitBtn = document.getElementById('submitResponseBtn');
    const submitText = document.getElementById('submitBtnText');
    const submitLoader = document.getElementById('submitBtnLoader');
    
    // Close confirmation modal
    closeConfirmationModal();
    
    // Show loading state in main modal
    submitBtn.disabled = true;
    submitText.style.display = 'none';
    submitLoader.style.display = 'inline';
    
    // Send AJAX request
    fetch('doctor/respond-appointment.php', {
        method: 'POST',
        body: pendingFormData
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            // Show success message
            const messageDiv = document.getElementById('responseMessage');
            messageDiv.innerHTML = '<p class="success-msg">✓ ' + data.message + '</p>';
            messageDiv.style.display = 'block';
            
            // Close modal and redirect after short delay
            setTimeout(() => {
                closeResponseModal();
                location.reload(); // Reload to show updated status
            }, 2000);
        } else {
            // Show error message
            const messageDiv = document.getElementById('responseMessage');
            messageDiv.innerHTML = '<p class="error-msg">✗ ' + (data.message || 'An error occurred. Please try again.') + '</p>';
            messageDiv.style.display = 'block';
            
            submitBtn.disabled = false;
            submitText.style.display = 'inline';
            submitLoader.style.display = 'none';
        }
    })
    .catch(error => {
        // Show error message
        const messageDiv = document.getElementById('responseMessage');
        messageDiv.innerHTML = '<p class="error-msg">✗ Network error. Please check your connection and try again.</p>';
        messageDiv.style.display = 'block';
        
        submitBtn.disabled = false;
        submitText.style.display = 'inline';
        submitLoader.style.display = 'none';
    });
}

function showMessage(message, type) {
    const messageDiv = document.getElementById('responseMessage');
    messageDiv.textContent = message;
    messageDiv.className = type === 'success' ? 'success-msg' : 'error-msg';
    messageDiv.style.display = 'block';
    
    // Scroll to message
    messageDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// Close modal when clicking outside
window.addEventListener('click', function(event) {
    const modal = document.getElementById('responseModal');
    if (event.target === modal) {
        closeResponseModal();
    }
});

// Close modal on Escape key
document.addEventListener('keydown', function(event) {
    if (event.key === 'Escape') {
        closeResponseModal();
    }
});
</script>
